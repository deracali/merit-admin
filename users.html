<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management Dashboard</title>
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-body: #f4f6f9;
      --bg-card: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success-bg: #d1fae5;
      --success-text: #065f46;
      --warning-bg: #fef3c7;
      --warning-text: #92400e;
      --danger-bg: #fee2e2;
      --danger-text: #991b1b;
      --info-bg: #e0f2fe;
      --info-text: #075985;
      --radius: 10px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      padding: 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #111827;
    }

    .refresh-btn {
      background-color: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s ease;
    }

    .refresh-btn:hover {
      background-color: var(--primary-hover);
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .stat-card p {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .stat-card h3 {
      font-size: 26px;
      margin-top: 6px;
      color: #111827;
    }

    /* Table Section */
    .table-container {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .table-controls {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 320px;
    }

    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .search-box input {
      width: 100%;
      padding: 8px 12px 8px 36px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
      font-size: 14px;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    th {
      background-color: #f9fafb;
      padding: 12px 16px;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }

    td {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
      white-space: nowrap;
    }

    tr:hover {
      background-color: #f9fafb;
    }

    /* User Cell */
    .user-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .user-name {
      font-weight: 600;
      color: #111827;
    }

    .user-email {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      text-transform: capitalize;
    }

    .badge-success { background: var(--success-bg); color: var(--success-text); }
    .badge-warning { background: var(--warning-bg); color: var(--warning-text); }
    .badge-danger { background: var(--danger-bg); color: var(--danger-text); }
    .badge-info { background: var(--info-bg); color: var(--info-text); }

    /* Action Button */
    .btn-action {
      background: none;
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-main);
      font-size: 13px;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: #f3f4f6;
      border-color: #d1d5db;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #fff;
      width: 90%;
      max-width: 850px;
      max-height: 85vh;
      border-radius: var(--radius);
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: var(--text-muted);
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .details-group label {
      font-size: 12px;
      color: var(--text-muted);
      display: block;
      margin-bottom: 2px;
    }

    .details-group span {
      font-weight: 500;
    }

    .modal-section-title {
      font-size: 16px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Trades Table */
    .trades-table-wrapper {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow-x: auto;
      margin-bottom: 20px;
    }

    .trades-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .trades-table th {
      background-color: #f9fafb;
      padding: 10px 12px;
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
    }

    .trades-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
    }

    /* Transaction Form */
    .tx-form {
      background: #f9fafb;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-top: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-group input, .form-group select {
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Dashboard Header -->
    <div class="header">
      <div>
        <h1>User Directory</h1>
        <p style="color: var(--text-muted); font-size: 14px;">Manage and monitor registered platform accounts</p>
      </div>
      <button class="refresh-btn" onclick="fetchUsers()">
        <i class="fa-solid fa-arrows-rotate" id="refresh-icon"></i> Reload Data
      </button>
    </div>

    <!-- Summary Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <p>Total Users</p>
        <h3 id="stat-total">0</h3>
      </div>
      <div class="stat-card">
        <p>Verified KYC</p>
        <h3 id="stat-verified">0</h3>
      </div>
      <div class="stat-card">
        <p>Active Accounts</p>
        <h3 id="stat-active">0</h3>
      </div>
      <div class="stat-card">
        <p>Total Main Balance</p>
        <h3 id="stat-balance">$0</h3>
      </div>
    </div>

    <!-- Main Table Card -->
    <div class="table-container">
      <div class="table-controls">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="search-input" placeholder="Search by name, email, or ID..." onkeyup="filterUsers()">
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Status</th>
              <th>KYC Status</th>
              <th>Role / Type</th>
              <th>Main Balance</th>
              <th>Created Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="user-table-body">
            <!-- Dynamic user rows will inject here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- User Details Modal -->
  <div class="modal-overlay" id="user-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>User Profile & Transactions</h3>
        <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="modal-body">
        <!-- Dynamic modal content -->
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:4000/api';

    // Dynamic dropdown options for supported currencies
    const CURRENCY_OPTIONS = [
      { value: 'BTC', label: 'BTC - Bitcoin' },
      { value: 'ETH', label: 'ETH - Ethereum' },
      { value: 'USDT', label: 'USDT - Tether' },
      { value: 'BNB', label: 'BNB - Binance Coin' },
      { value: 'SOL', label: 'SOL - Solana' },
      { value: 'USD', label: 'USD - US Dollar' },
      { value: 'EUR', label: 'EUR - Euro' },
      { value: 'GBP', label: 'GBP - British Pound' }
    ];

    const fallbackData = [
      {
        "_id": "69a17e5b082632ceafbf1c06",
        "displayName": "Samuel Calistus",
        "firstName": "Samuel",
        "lastName": "Calistus",
        "email": "chideracalistus00@gmail.com",
        "photo": "https://lh3.googleusercontent.com/a/ACg8ocIWnXpFYU8piWdnfLzScD24bW8BPsZAiX0fu1e7-vjvx5RLUJf9=s96-c",
        "type": "vendor",
        "status": "active",
        "role": "User",
        "mainBalance": 0,
        "kyc": { "isVerified": false },
        "createdAt": "2026-02-27T11:22:03.823Z"
      },
      {
        "_id": "6a5f2b1ea136d8f5cc67a153",
        "firstName": "Chidera",
        "lastName": "Calistus",
        "email": "sample@gmail.com",
        "mainBalance": 25000,
        "kycStatus": "not_started",
        "createdAt": "2026-07-21T08:17:34.094Z",
        "cryptoAccounts": [{ "coinName": "BITCOIN", "balance": 40000 }],
        "bankAccounts": [{ "bankName": "First Bank", "accountNumber": "5478743397" }]
      }
    ];

    const fallbackTrades = [
      {
        "_id": "6a6074d8a43f302d97ae33d0",
        "userId": "6a5f2b1ea136d8f5cc67a153",
        "type": "buy",
        "cryptoSymbol": "USDT",
        "fiatCurrency": "usd",
        "cryptoAmount": 500,
        "fiatAmount": 500,
        "rateApplied": 1,
        "status": "completed",
        "createdAt": "2026-07-22T07:44:24.525Z"
      }
    ];

    let usersList = [];

    async function fetchUsers() {
      const refreshIcon = document.getElementById('refresh-icon');
      refreshIcon.classList.add('fa-spin');

      try {
        const response = await fetch(`${API_BASE_URL}/users`);
        const result = await response.json();

        if (result.success && Array.isArray(result.data)) {
          usersList = result.data;
        } else {
          usersList = fallbackData;
        }
      } catch (error) {
        console.warn('API endpoint unreachable. Loading fallback dataset.', error);
        usersList = fallbackData;
      } finally {
        setTimeout(() => refreshIcon.classList.remove('fa-spin'), 500);
        updateDashboard(usersList);
      }
    }

    function updateDashboard(data) {
      updateMetrics(data);
      renderTable(data);
    }

    function updateMetrics(data) {
      document.getElementById('stat-total').innerText = data.length;

      const verifiedCount = data.filter(u =>
        u.isVerified || u.kycStatus === 'approved' || u.kyc?.isVerified
      ).length;
      document.getElementById('stat-verified').innerText = verifiedCount;

      const activeCount = data.filter(u => u.status === 'active' || u.status === 'verified').length;
      document.getElementById('stat-active').innerText = activeCount;

      const totalBalance = data.reduce((sum, u) => sum + (u.mainBalance || u.balance || 0), 0);
      document.getElementById('stat-balance').innerText = `$${totalBalance.toLocaleString()}`;
    }

    function renderTable(data) {
      const tbody = document.getElementById('user-table-body');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">No users found.</td></tr>`;
        return;
      }

      data.forEach(user => {
        const name = getFullName(user);
        const email = user.email || 'N/A';
        const photo = user.photo || user.image;
        const initials = name.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase() || 'U';

        const balance = user.mainBalance ?? user.balance ?? 0;
        const status = user.status || 'N/A';
        const kycState = getKycStatus(user);
        const roleOrType = user.role || user.type || 'N/A';
        const createdDate = user.createdAt ? new Date(user.createdAt).toLocaleDateString() : 'N/A';

        const row = document.createElement('tr');
        row.innerHTML = `
          <td>
            <div class="user-cell">
              ${photo ? `<img src="${photo}" class="user-avatar" alt="avatar" onerror="this.outerHTML='<div class=\\'user-avatar\\'>${initials}</div>'">`
                      : `<div class="user-avatar">${initials}</div>`}
              <div class="user-info">
                <span class="user-name">${name}</span>
                <span class="user-email">${email}</span>
              </div>
            </div>
          </td>
          <td>${getStatusBadge(status)}</td>
          <td>${getKycBadge(kycState)}</td>
          <td style="text-transform: capitalize;">${roleOrType}</td>
          <td style="font-weight: 600;">$${balance.toLocaleString()}</td>
          <td>${createdDate}</td>
          <td>
            <button class="btn-action" onclick="openModal('${user._id}')">View Details</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function getFullName(user) {
      if (user.displayName) return user.displayName;
      const first = user.firstName || '';
      const last = user.lastName || '';
      return `${first} ${last}`.trim() || 'Unnamed User';
    }

    function getKycStatus(user) {
      if (user.kycStatus) return user.kycStatus;
      if (user.kyc && user.kyc.isVerified) return 'approved';
      if (user.isVerified) return 'approved';
      return 'not_started';
    }

    function getStatusBadge(status) {
      const s = status.toLowerCase();
      if (s === 'active' || s === 'verified') return `<span class="badge badge-success">${status}</span>`;
      if (s === 'pending') return `<span class="badge badge-warning">${status}</span>`;
      return `<span class="badge badge-danger">${status}</span>`;
    }

    function getKycBadge(kycState) {
      const state = kycState.toLowerCase();
      if (state === 'approved' || state === 'verified') return `<span class="badge badge-success">Approved</span>`;
      if (state === 'pending') return `<span class="badge badge-warning">Pending</span>`;
      return `<span class="badge badge-danger">Unverified</span>`;
    }

    function filterUsers() {
      const term = document.getElementById('search-input').value.toLowerCase();
      const filtered = usersList.filter(user => {
        const name = getFullName(user).toLowerCase();
        const email = (user.email || '').toLowerCase();
        const id = (user._id || '').toLowerCase();
        return name.includes(term) || email.includes(term) || id.includes(term);
      });
      renderTable(filtered);
    }

    async function fetchUserTrades(userId) {
      try {
        const response = await fetch(`${API_BASE_URL}/trades/user/${userId}`);
        const result = await response.json();
        if (result.success && Array.isArray(result.data)) {
          return result.data;
        }
      } catch (err) {
        console.warn('Could not fetch user trades, checking fallback data.', err);
      }
      return fallbackTrades.filter(t => t.userId === userId);
    }

    async function openModal(userId) {
      const user = usersList.find(u => u._id === userId);
      if (!user) return;

      const modalBody = document.getElementById('modal-body');

      const currencyOptionsHtml = CURRENCY_OPTIONS.map(c =>
        `<option value="${c.value}">${c.label}</option>`
      ).join('');

      modalBody.innerHTML = `
        <div class="details-grid">
          <div class="details-group">
            <label>User ID</label>
            <span>${user._id}</span>
          </div>
          <div class="details-group">
            <label>Full Name</label>
            <span>${getFullName(user)}</span>
          </div>
          <div class="details-group">
            <label>Email Address</label>
            <span>${user.email || 'N/A'}</span>
          </div>
          <div class="details-group">
            <label>Main Balance (USD)</label>
            <span style="color: var(--primary); font-weight: 700;">$${(user.mainBalance || 0).toLocaleString()}</span>
          </div>
        </div>

        <div class="modal-section-title">
          <i class="fa-solid fa-plus-minus"></i> Execute Transaction
        </div>

        <form class="tx-form" onsubmit="handleTransactionSubmit(event, '${user._id}')">
          <div class="form-grid">
            <div class="form-group">
              <label>Type</label>
              <select id="tx-type" onchange="updateDefaultDescription()" required>
                <option value="credit">Credit / Deposit</option>
                <option value="withdraw">Withdraw / Debit</option>
              </select>
            </div>
            <div class="form-group">
              <label>Currency</label>
              <select id="tx-currency" onchange="updateDefaultDescription()" required>
                ${currencyOptionsHtml}
              </select>
            </div>
            <div class="form-group">
              <label>Amount</label>
              <input type="number" id="tx-amount" step="any" min="0.00000001" placeholder="100.00" required>
            </div>
            <div class="form-group">
              <label>Status</label>
              <select id="tx-status">
                <option value="completed">Completed</option>
                <option value="pending">Pending</option>
                <option value="failed">Failed</option>
              </select>
            </div>
          </div>
          <div class="form-group" style="margin-bottom: 12px;">
            <label>Description</label>
            <input type="text" id="tx-description" placeholder="Deposit BTC into account">
          </div>
          <button type="submit" class="btn-submit">Submit Transaction</button>
        </form>

        <div class="modal-section-title" style="margin-top: 24px;">
          <i class="fa-solid fa-right-left"></i> User Trades
        </div>

        <div id="trades-container">
          <p style="color: var(--text-muted); font-size: 13px;"><i class="fa-solid fa-spinner fa-spin"></i> Loading user trades...</p>
        </div>
      `;

      document.getElementById('user-modal').classList.add('active');

      // Populate default description dynamically when modal opens
      updateDefaultDescription();

      const trades = await fetchUserTrades(userId);
      renderUserTrades(trades);
    }

    // Dynamic description builder depending on Credit/Withdrawal & Currency selection
    function updateDefaultDescription() {
      const typeSelect = document.getElementById('tx-type');
      const currencySelect = document.getElementById('tx-currency');
      const descriptionInput = document.getElementById('tx-description');

      if (!typeSelect || !currencySelect || !descriptionInput) return;

      const type = typeSelect.value;
      const currency = currencySelect.value;
      const isFiat = ['USD', 'EUR', 'GBP'].includes(currency);

      let defaultText = '';

      if (type === 'credit') {
        defaultText = isFiat
          ? `Deposit ${currency} into user main balance`
          : `Credit ${currency} deposit to wallet`;
      } else {
        defaultText = isFiat
          ? `Withdrawal of ${currency} from main balance`
          : `Withdrawal of ${currency} to external wallet address`;
      }

      descriptionInput.placeholder = defaultText;

      // Only auto-fill if user hasn't manually edited the text field
      if (!descriptionInput.dataset.customEdited) {
        descriptionInput.value = defaultText;
      }
    }

    // Flag when user explicitly types in the description field
    document.addEventListener('input', (e) => {
      if (e.target && e.target.id === 'tx-description') {
        e.target.dataset.customEdited = 'true';
      }
    });

    async function handleTransactionSubmit(event, userId) {
      event.preventDefault();

      const payload = {
        type: document.getElementById('tx-type').value,
        amount: parseFloat(document.getElementById('tx-amount').value),
        currency: document.getElementById('tx-currency').value,
        status: document.getElementById('tx-status').value,
        description: document.getElementById('tx-description').value
      };

      try {
        const response = await fetch(`${API_BASE_URL}/users/${userId}/transactions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.success) {
          alert(`Success: ${result.message}`);
          await fetchUsers(); // Refresh background dataset
          openModal(userId);  // Reload current modal view
        } else {
          alert(`Transaction Failed: ${result.message}`);
        }
      } catch (err) {
        alert(`Error executing transaction: ${err.message}`);
      }
    }

    function renderUserTrades(trades) {
      const tradesContainer = document.getElementById('trades-container');
      if (!tradesContainer) return;

      if (!trades || trades.length === 0) {
        tradesContainer.innerHTML = `<p style="color: var(--text-muted); font-size: 13px;">No trade history found for this user.</p>`;
        return;
      }

      let rows = trades.map(trade => {
        const typeBadge = trade.type === 'buy'
          ? `<span class="badge badge-success">BUY</span>`
          : `<span class="badge badge-danger">SELL</span>`;

        const date = trade.createdAt ? new Date(trade.createdAt).toLocaleString() : 'N/A';
        const fiatCurr = (trade.fiatCurrency || 'USD').toUpperCase();

        return `
          <tr>
            <td>${typeBadge}</td>
            <td style="font-weight: 600;">${trade.cryptoAmount} ${trade.cryptoSymbol}</td>
            <td>${trade.fiatAmount} ${fiatCurr}</td>
            <td>${trade.rateApplied}</td>
            <td><span class="badge badge-info">${trade.status}</span></td>
            <td>${date}</td>
          </tr>
        `;
      }).join('');

      tradesContainer.innerHTML = `
        <div class="trades-table-wrapper">
          <table class="trades-table">
            <thead>
              <tr>
                <th>Type</th>
                <th>Crypto Amount</th>
                <th>Fiat Amount</th>
                <th>Rate</th>
                <th>Status</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>
        </div>
      `;
    }

    function closeModal() {
      document.getElementById('user-modal').classList.remove('active');
    }

    window.addEventListener('DOMContentLoaded', fetchUsers);
  </script>
</body>
</html>
